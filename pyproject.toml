[project]
name = "chess-opening-analyser"
version = "0.1.0"
description = ""
authors = [{ name = "Matyas Juhasz", email = "juhaszmp@gmail.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pandas>=2.0.3,<3",
    "tqdm>=4.65.0,<5",
    "requests>=2.31.0,<3",
    "chess>=1.9.4,<2",
    "networkx>=3.1,<4",
    "pydantic>=2.1.1,<3",
    "black>=23.7.0,<24",
    "pytest>=7.4.0,<8",
    "pytest-mock>=3.11.1,<4",
    "loguru>=0.7.0,<0.8",
    "plotly>=5.18.0,<6",
    "pre-commit>=3.6.2,<4",
    "pyright>=1.1.351,<2",
    "matplotlib>=3.8.3,<4",
    "seaborn>=0.13.2,<0.14",
    "python-dotenv>=1.0.1,<2",
    "ipykernel>=6.29.4,<7",
    "fastapi>=0.136.1",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
