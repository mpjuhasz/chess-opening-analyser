repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -vvv --ignore tests/games/test_chess_com.py --ignore tests/engine/test_stockfish.py
        exclude: ^(tests/games/test_chess_com\.py|tests/engine/test_stockfish\.py)$
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
